<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surplus Materials · Haggerty Shop</title>
<style>
  :root{
    --bg:#232323; --card:#2b2b2b; --line:#3a3a3a; --field:#2b2b2b;
    --orange:#F68922; --orange-press:#d9760f;
    --ink:#1b1b1b; --paper:#f4f4f2; --muted:#9a9a9a; --gray:#4D4D4D;
    --green:#3fb27f; --red:#e25c4e;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--paper); font-family:Calibri,"Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1100px; margin:0 auto; padding:20px 22px 130px;}
  .top{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .back{color:var(--paper); text-decoration:none; display:flex; padding:8px; margin:-8px 0 -8px -8px;}
  .mark{height:34px; width:auto;}
  .mark-rhino{margin-left:-4px;}
  .htitle{font-family:"Arial Narrow",Arial,sans-serif; font-weight:800; letter-spacing:.14em; text-transform:uppercase; font-size:17px;}
  .adminTag{display:none; font-size:12px; color:var(--orange); font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin-left:auto;}
  body.admin .adminTag{display:inline;}
  .rule{height:6px; margin:0 0 22px; border-radius:4px; background:repeating-linear-gradient(135deg,var(--orange) 0 14px,#2b2b2b 14px 26px);}
  .lead{font-family:Georgia,serif; font-size:24px; margin:0 0 6px;}
  .sub{color:var(--muted); margin:0 0 18px; font-size:14px; line-height:1.4;}
  .bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:22px;}
  .bar input{flex:1; min-width:200px; background:var(--field); color:var(--paper); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; font-size:16px; font-family:inherit;}
  .bar input:focus{outline:none; border-color:var(--orange);}
  .chip{appearance:none; border:1.5px solid var(--gray); background:transparent; color:var(--paper); border-radius:999px; padding:9px 14px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer;}
  .chip.on{background:var(--orange); border-color:var(--orange); color:var(--ink);}
  #addBtn{display:none; background:var(--orange); border-color:var(--orange); color:var(--ink);}
  body.admin #addBtn{display:inline-block;}
  .stats{display:flex; flex-wrap:wrap; gap:16px; color:var(--muted); font-size:14px; margin-bottom:22px;}
  .stats b{color:var(--paper);}
  h2{font-family:"Arial Narrow",Arial,sans-serif; font-weight:800; letter-spacing:.1em; text-transform:uppercase; font-size:15px; color:var(--orange); margin:28px 0 12px; display:flex; align-items:baseline; gap:10px;}
  h2 small{color:var(--muted); font-weight:400; letter-spacing:0; text-transform:none; font-size:13px; font-family:Calibri,"Segoe UI",system-ui,sans-serif;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:12px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column;}
  .card.inCart{border-color:var(--orange);}
  .card.gone{opacity:.6;}
  .card.busy{opacity:.55; pointer-events:none;}
  .ph{aspect-ratio:4/3; background:#1e1e1e; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; overflow:hidden; position:relative;}
  .ph img{width:100%; height:100%; object-fit:cover; display:block;}
  .ph.missing{background:repeating-linear-gradient(135deg,#262626 0 10px,#2d2d2d 10px 20px); font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-size:12px;}
  body.admin .ph{cursor:pointer;}
  body.admin .ph::after{content:'Tap to add photo'; position:absolute; left:0; right:0; bottom:0; background:rgba(0,0,0,.65); color:var(--paper); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:6px; text-align:center;}
  body.admin .ph:has(img)::after{content:'Tap to replace';}
  .body{padding:12px 14px 14px; display:flex; flex-direction:column; flex:1;}
  .nm{font-size:16px; font-weight:700; line-height:1.25; margin-bottom:2px;}
  .sz{font-size:14px; color:#d8d8d8; margin-bottom:4px;}
  .meta{font-size:12px; color:var(--muted); display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px;}
  .meta .code{font-family:Consolas,monospace;}
  .qty{font-size:15px; font-weight:700; margin:4px 0 8px;}
  .qty.zero{color:var(--red);}
  .qty.unk{color:var(--muted); font-weight:400; font-style:italic;}
  .notes{font-size:13px; color:#c9c9c9; margin-bottom:8px; line-height:1.35;}
  .take{appearance:none; border:0; border-radius:10px; padding:11px 14px; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer; background:var(--green); color:var(--ink); margin-top:auto;}
  .take:disabled{opacity:.4; cursor:default;}
  .stepper{display:none; align-items:center; gap:6px; margin-top:auto;}
  .card.inCart .stepper{display:flex;}
  .card.inCart .take{display:none;}
  .stepper button{appearance:none; border:1.5px solid var(--gray); background:transparent; color:var(--paper); width:38px; height:38px; border-radius:10px; font-size:20px; font-weight:700; cursor:pointer; font-family:inherit;}
  .stepper input{width:64px; text-align:center; background:var(--field); color:var(--paper); border:1.5px solid var(--orange); border-radius:10px; padding:8px 4px; font-size:16px; font-family:inherit;}
  .stepper .rm{margin-left:auto; border:0; width:auto; font-size:12px; text-decoration:underline; color:var(--muted); font-weight:400;}
  .editLink{appearance:none; background:none; border:0; color:var(--muted); font-size:12px; text-decoration:underline; cursor:pointer; padding:0; margin-top:8px; font-family:inherit; display:none; align-self:flex-start;}
  body.admin .editLink{display:inline-block;}
  .empty{color:var(--muted); font-style:italic; padding:30px; text-align:center;}
  .err{background:rgba(226,92,78,.12); border:1px solid rgba(226,92,78,.5); border-radius:12px; padding:14px; color:var(--paper);}
  /* Take bar */
  .takeBar{position:fixed; left:0; right:0; bottom:0; z-index:60; background:var(--bg); border-top:1.5px solid var(--line); padding:12px 22px calc(12px + env(safe-area-inset-bottom)); display:none;}
  .takeBar.show{display:block;}
  .takeBar .inner{max-width:1100px; margin:0 auto; display:flex; gap:10px; align-items:center;}
  .takeBar .cnt{color:var(--muted); font-size:14px; flex:1;}
  .takeBar .cnt b{color:var(--paper);}
  .takeBar button{appearance:none; border:0; border-radius:12px; padding:14px 20px; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; background:var(--orange); color:var(--ink);}
  .takeBar button:disabled{opacity:.45; cursor:default;}
  /* Modals */
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:80; display:none; align-items:center; justify-content:center; padding:20px;}
  .modal.show{display:flex;}
  .modal .box{background:var(--bg); border:1.5px solid var(--line); border-radius:16px; padding:24px; max-width:440px; width:100%; max-height:92vh; overflow:auto;}
  .modal h3{font-family:Georgia,serif; font-size:20px; margin:0 0 14px;}
  .modal label{display:block; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:14px 0 6px;}
  .modal input,.modal select,.modal textarea{width:100%; background:var(--field); color:var(--paper); border:1.5px solid var(--line); border-radius:12px; padding:13px 14px; font-size:16px; font-family:inherit;}
  .modal input:focus,.modal select:focus,.modal textarea:focus{outline:none; border-color:var(--orange);}
  .modal select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' stroke='%239a9a9a' stroke-width='2'><path d='M5 8l5 5 5-5'/></svg>"); background-repeat:no-repeat; background-position:right 14px center; padding-right:42px; appearance:none;}
  .modal .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .modal .photoBtn{width:100%; margin-top:6px; appearance:none; border:1.5px dashed var(--gray); background:transparent; color:var(--paper); border-radius:12px; padding:13px; font-size:15px; font-family:inherit; cursor:pointer;}
  .modal .photoBtn.has{border-style:solid; border-color:var(--green); color:var(--green);}
  .modal ul.sum{list-style:none; padding:0; margin:0 0 6px;}
  .modal ul.sum li{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:15px;}
  .modal ul.sum li b{color:var(--orange);}
  .modal .buttons{display:flex; flex-direction:column; gap:10px; margin-top:20px;}
  .modal .go{appearance:none; border:0; border-radius:12px; padding:15px; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; background:var(--orange); color:var(--ink);}
  .modal .go:disabled{opacity:.5;}
  .modal .cancel{appearance:none; border:1.5px solid var(--gray); border-radius:12px; padding:15px; font-size:15px; font-weight:600; font-family:inherit; cursor:pointer; background:transparent; color:var(--paper);}
  .modal .danger{appearance:none; background:none; border:0; color:var(--red); font-size:13px; text-decoration:underline; cursor:pointer; font-family:inherit; padding:6px 0 0; display:none;}
  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); background:var(--card); color:var(--paper); border:1.5px solid var(--line); border-radius:12px; padding:12px 18px; font-size:14px; opacity:0; transition:.2s; z-index:90; pointer-events:none; max-width:92%;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.ok{border-color:var(--green);} .toast.bad{border-color:var(--red);}
</style>
</head>

      <div class="htitle">Surplus Materials</div>

    </div>
    <div class="rule"></div>
    <p class="lead">Leftover stock from past jobs</p>
    <p class="sub">Free to use on any job. Tap Take on what you're grabbing, set the amount, then confirm at the bottom. It comes off the count so the next person knows what's left.</p>
    <div class="bar">
      <input type="search" id="q" placeholder="Search materials…" autocomplete="off">
      <button class="chip on" data-f="all">All</button>
      <button class="chip" data-f="instock">In stock</button>
      <button class="chip" id="addBtn" type="button">+ Add item</button>
    </div>
    <div class="stats" id="stats"></div>
    <div id="content"><div class="empty">Loading…</div></div>
  </main>
  <div class="takeBar" id="takeBar">
    <div class="inner">
      <div class="cnt" id="takeCount"></div>
      <button type="button" id="takeGo">Confirm take</button>
    </div>
  </div>
  <input type="file" id="picker" accept="image/*" capture="environment" style="display:none;">
  <div class="toast" id="toast"></div>
  <!-- Confirm take -->
  <div class="modal" id="takeModal">
    <div class="box">
      <h3>Confirm what you're taking</h3>
      <ul class="sum" id="takeSummary"></ul>
      <label for="takeName">Your name</label>
      <select id="takeName"><option value="" selected disabled>Pick your name</option></select>
      <label for="takeNotes">Job or note <span style="text-transform:none; font-weight:400;">(optional)</span></label>
      <input id="takeNotes" placeholder="Where it's going" autocomplete="off">
      <div class="buttons">
        <button type="button" class="go" id="takeConfirm">Take it</button>
        <button type="button" class="cancel" id="takeCancel">Back</button>
      </div>
    </div>
  </div>
  <!-- Admin add / edit -->
  <div class="modal" id="modal">
    <div class="box">
      <h3 id="mTitle">Add a material</h3>
      <label for="mName">Name</label>
      <input id="mName" placeholder="e.g. Common Nails" autocomplete="off">
      <div class="row2">
        <div><label for="mSize">Size <span style="text-transform:none; font-weight:400;">(optional)</span></label><input id="mSize" placeholder="e.g. 16D, 3 1/2 in" autocomplete="off"></div>
        <div><label for="mLoc">Location</label><input id="mLoc" placeholder="e.g. Row 2" autocomplete="off"></div>
      </div>
      <label for="mCat">Category</label>
      <select id="mCat"></select>
      <div class="row2">
        <div><label for="mQty">Count</label><input id="mQty" type="number" min="0" inputmode="numeric" value="0"></div>
        <div><label for="mUnit">Unit</label><select id="mUnit"><option value="each">each</option><option value="box">box</option><option value="bin">bin</option><option value="bucket">bucket</option><option value="roll">roll</option><option value="bag">bag</option><option value="sheet">sheet</option><option value="stick">stick</option></select></div>
      </div>
      <label for="mNotes">Notes <span style="text-transform:none; font-weight:400;">(optional)</span></label>
      <textarea id="mNotes" rows="2" placeholder="Brand, condition, where it came from..."></textarea>
      <label id="mPhotoLabel">Photo <span style="text-transform:none; font-weight:400;">(optional, you can add it later)</span></label>
      <button type="button" class="photoBtn" id="mPhotoBtn">Take a photo</button>
      <div class="buttons">
        <button type="button" class="go" id="mGo">Add to list</button>
        <button type="button" class="cancel" id="mCancel">Cancel</button>
        <button type="button" class="danger" id="mRetire">Remove from the list (used up or gone)</button>
      </div>
    </div>
  </div>
  <script src="device.js"></script>
  <script>
    const SUPABASE_URL = "https://tdflgfuqjnwctadsjizz.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_w9xkQQE07152NL8faFVTwQ_LSJ9Hf_d";
    const PHOTO_BASE = SUPABASE_URL + "/storage/v1/object/public/tool-photos/";
    const H = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY };
    const LISTS_URL  = "https://haggertybuilds.app.n8n.cloud/webhook/sb-shop-lists";
    const ADJUST_URL = "https://haggertybuilds.app.n8n.cloud/webhook/sb-surplus-adjust";
    const UPLOAD_URL = "https://haggertybuilds.app.n8n.cloud/webhook/sb-tool-photo-upload";
    const ADMIN_URL  = "https://haggertybuilds.app.n8n.cloud/webhook/sb-tool-admin";
    const CAT_ORDER = ['Nails','Screws','Fasteners & Hardware','Electrical','Plumbing','Paint & Chemicals','Adhesives & Tape','Building Materials'];
    const NAME_KEY = 'haggerty_shop_name';
    const MAX_SIDE = 1200, JPEG_Q = 0.82;
    const ADMIN_KEY = (new URLSearchParams(location.search).get('key') || '').trim();
    const ADMIN = !!ADMIN_KEY;
    if (ADMIN) document.body.classList.add('admin');
    let items = [], people = [], filter = 'all', q = '';
    const cart = new Map();   // item_code -> qty
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    let toastT;
    function toast(msg, kind){ const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show' + (kind ? ' ' + kind : ''); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }
    function unitLabel(n, u){ if (u === 'each') return String(n); return n + ' ' + u + (n === 1 ? '' : (u.endsWith('x') ? 'es' : 's')); }

    async function load(){
      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/surplus_materials?select=item_code,item_name,category,size,location,quantity,unit,count_verified,notes,photo_path&active=eq.true&order=category,item_name,size', { headers: H, cache: 'no-store' });
        items = await res.json();
        if (!Array.isArray(items)) throw new Error('bad');
        render();
      } catch(e) {
        document.getElementById('content').innerHTML = '<div class="err">Could not load the list. Check your signal and refresh.</div>';
      }
      try {
        const r = await fetch(LISTS_URL, { cache: 'no-store' }); const d = await r.json();
        people = (d && d.people) || [];
        const sel = document.getElementById('takeName');
        people.forEach(p => { const o = document.createElement('option'); o.value = p.name; o.textContent = p.name; sel.appendChild(o); });
        try { const saved = localStorage.getItem(NAME_KEY); if (saved && people.some(p => p.name === saved)) sel.value = saved; } catch(e) {}
      } catch(e) { /* names load lazily; the take button will complain if empty */ }
    }
    function render(){
      const ql = q.toLowerCase();
      const list = items.filter(t => {
        if (filter === 'instock' && !(t.quantity > 0 || !t.count_verified)) return false;
        if (ql && !((t.item_name + ' ' + (t.size||'') + ' ' + (t.location||'') + ' ' + t.category + ' ' + (t.notes||'')).toLowerCase().includes(ql))) return false;
        return true;
      });
      const inStock = items.filter(t => t.quantity > 0 || !t.count_verified).length;
      const unk = items.filter(t => !t.count_verified).length;
      document.getElementById('stats').innerHTML = '<span><b>' + items.length + '</b> materials</span><span><b>' + inStock + '</b> available</span>' + (unk ? '<span><b>' + unk + '</b> not yet counted</span>' : '');
      const cats = {};
      list.forEach(t => (cats[t.category] = cats[t.category] || []).push(t));
      const order = CAT_ORDER.filter(c => cats[c]).concat(Object.keys(cats).filter(c => !CAT_ORDER.includes(c)).sort());
      const el = document.getElementById('content');
      if (!order.length) { el.innerHTML = '<div class="empty">Nothing matches.</div>'; return; }
      el.innerHTML = order.map(c => '<h2>' + esc(c) + ' <small>' + cats[c].length + '</small></h2><div class="grid">'
        + cats[c].map(t => {
          const gone = t.count_verified && t.quantity <= 0;
          const inCart = cart.has(t.item_code);
          const qtyHtml = !t.count_verified ? '<div class="qty unk">Count not yet taken</div>'
            : gone ? '<div class="qty zero">None left</div>'
            : '<div class="qty">' + esc(unitLabel(t.quantity, t.unit)) + ' available</div>';
          return '<div class="card' + (gone ? ' gone' : '') + (inCart ? ' inCart' : '') + '" data-code="' + esc(t.item_code) + '">'
            + (t.photo_path ? '<div class="ph"><img src="' + PHOTO_BASE + encodeURIComponent(t.photo_path) + '" alt="" loading="lazy" onerror="this.parentNode.className=\'ph missing\';this.parentNode.textContent=\'Photo missing\'"></div>' : '<div class="ph missing">No photo yet</div>')
            + '<div class="body"><div class="nm">' + esc(t.item_name) + '</div>'
            + (t.size ? '<div class="sz">' + esc(t.size) + '</div>' : '')
            + '<div class="meta"><span class="code">' + esc(t.item_code) + '</span>' + (t.location ? '<span>' + esc(t.location) + '</span>' : '') + '</div>'
            + qtyHtml
            + (t.notes ? '<div class="notes">' + esc(t.notes) + '</div>' : '')
            + '<button type="button" class="take"' + (gone ? ' disabled' : '') + '>Take</button>'
            + '<div class="stepper"><button type="button" class="dec">−</button><input type="number" min="1" inputmode="numeric" value="' + (inCart ? cart.get(t.item_code) : 1) + '"><button type="button" class="inc">+</button><button type="button" class="rm">Remove</button></div>'
            + '<button type="button" class="editLink">Edit</button>'
            + '</div></div>';
        }).join('') + '</div>').join('');
      el.querySelectorAll('.card').forEach(card => {
        const code = card.dataset.code; const t = items.find(x => x.item_code === code);
        const inp = card.querySelector('.stepper input');
        card.querySelector('.take').addEventListener('click', () => { cart.set(code, 1); card.classList.add('inCart'); inp.value = 1; updateBar(); });
        card.querySelector('.inc').addEventListener('click', () => { inp.value = Math.max(1, (parseInt(inp.value,10)||0) + 1); cart.set(code, parseInt(inp.value,10)); updateBar(); });
        card.querySelector('.dec').addEventListener('click', () => { inp.value = Math.max(1, (parseInt(inp.value,10)||1) - 1); cart.set(code, parseInt(inp.value,10)); updateBar(); });
        inp.addEventListener('input', () => { const v = Math.max(1, parseInt(inp.value,10)||1); cart.set(code, v); updateBar(); });
        card.querySelector('.rm').addEventListener('click', () => { cart.delete(code); card.classList.remove('inCart'); updateBar(); });
        if (ADMIN) {
          card.querySelector('.ph').addEventListener('click', () => pickPhoto(t, card));
          card.querySelector('.editLink').addEventListener('click', () => openEdit(t));
        }
      });
      updateBar();
    }
    function updateBar(){
      const n = cart.size; let units = 0; cart.forEach(v => units += v);
      document.getElementById('takeBar').classList.toggle('show', n > 0);
      document.getElementById('takeCount').innerHTML = '<b>' + n + '</b> item' + (n === 1 ? '' : 's') + ', <b>' + units + '</b> total';
    }
    document.getElementById('q').addEventListener('input', e => { q = e.target.value.trim(); render(); });
    document.querySelectorAll('.chip[data-f]').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('.chip[data-f]').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); filter = b.dataset.f; render();
    }));
    // ---- Take flow ----
    document.getElementById('takeGo').addEventListener('click', () => {
      if (!cart.size) return;
      const ul = document.getElementById('takeSummary'); ul.innerHTML = '';
      cart.forEach((qty, code) => { const t = items.find(x => x.item_code === code); if (!t) return;
        const li = document.createElement('li'); li.innerHTML = '<span></span><b></b>';
        li.querySelector('span').textContent = t.item_name + (t.size ? ' · ' + t.size : ''); li.querySelector('b').textContent = unitLabel(qty, t.unit); ul.appendChild(li); });
      document.getElementById('takeConfirm').disabled = false; document.getElementById('takeConfirm').textContent = 'Take it';
      document.getElementById('takeModal').classList.add('show');
    });
    document.getElementById('takeCancel').addEventListener('click', () => document.getElementById('takeModal').classList.remove('show'));
    document.getElementById('takeConfirm').addEventListener('click', async () => {
      const person = document.getElementById('takeName').value;
      if (!person) { toast('Pick your name', 'bad'); return; }
      const btn = document.getElementById('takeConfirm'); btn.disabled = true; btn.textContent = 'Recording…';
      const list = []; cart.forEach((quantity, itemCode) => list.push({ itemCode, quantity }));
      try {
        const res = await fetch(ADJUST_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ person, action: 'take', items: list, notes: document.getElementById('takeNotes').value.trim(), deviceToken: HagDevice.token() }) });
        const data = await res.json().catch(() => null);
        if (!data || data.ok !== true) throw new Error((data && data.message) || 'Could not record that');
        try { localStorage.setItem(NAME_KEY, person); } catch(e) {}
        HagDevice.claim(person);
        (data.done || []).forEach(d => { const t = items.find(x => x.item_code === d.itemCode); if (t) { t.quantity = d.after; t.count_verified = true; } });
        cart.clear();
        document.getElementById('takeModal').classList.remove('show');
        document.getElementById('takeNotes').value = '';
        toast('Got it. ' + (data.done || []).length + ' item' + ((data.done||[]).length === 1 ? '' : 's') + ' recorded under ' + person.replace(/\.$/, '') + '.', 'ok');
        render();
      } catch(err) { toast(err.message, 'bad'); btn.disabled = false; btn.textContent = 'Take it'; }
    });
    // ---- Admin: photos, add, edit, restock ----
    let pendingPhoto = null, modalPhotoB64 = null, editing = null;
    function pickPhoto(t, card){ pendingPhoto = { t, card }; const p = document.getElementById('picker'); p.value = ''; p.click(); }
    document.getElementById('picker').addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0]; if (!file || !pendingPhoto) return;
      const job = pendingPhoto; pendingPhoto = null;
      if (job.forModal) { try { modalPhotoB64 = await shrink(file); const b = document.getElementById('mPhotoBtn'); b.textContent = 'Photo ready (tap to retake)'; b.classList.add('has'); } catch(err) { toast('Could not read that photo', 'bad'); } return; }
      job.card.classList.add('busy');
      try { const b64 = await shrink(file); await uploadPhoto(job.t.item_code, b64); job.t.photo_path = job.t.item_code.toLowerCase() + '.jpg'; toast(job.t.item_name + ' photo saved', 'ok'); render(); }
      catch(err) { toast(/unauthor/i.test(String(err.message)) ? 'Access key not accepted' : 'Upload failed, try again', 'bad'); job.card.classList.remove('busy'); }
    });
    async function uploadPhoto(itemCode, b64){
      const res = await fetch(UPLOAD_URL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ token: ADMIN_KEY, photos: [{ itemCode, path: itemCode.toLowerCase() + '.jpg', contentType: 'image/jpeg', base64: b64 }] }) });
      const data = await res.json().catch(() => null);
      if (!res.ok || !data || data.ok !== true) throw new Error((data && data.message) || (res.status === 500 ? 'unauthorized' : 'upload failed'));
    }
    async function shrink(file){
      let bmp;
      try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
      catch(e) { bmp = await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = URL.createObjectURL(file); }); }
      const w = bmp.width, h = bmp.height, sc = Math.min(1, MAX_SIDE / Math.max(w, h));
      const c = document.createElement('canvas'); c.width = Math.round(w * sc); c.height = Math.round(h * sc);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', JPEG_Q).split(',')[1];
    }
    function fillCats(){
      const sel = document.getElementById('mCat');
      const cats = CAT_ORDER.slice(); items.forEach(t => { if (!cats.includes(t.category)) cats.push(t.category); });
      sel.innerHTML = cats.map(c => '<option value="' + esc(c) + '">' + esc(c) + '</option>').join('');
    }
    function openAdd(){
      editing = null; modalPhotoB64 = null; fillCats();
      document.getElementById('mTitle').textContent = 'Add a material';
      ['mName','mSize','mLoc','mNotes'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('mQty').value = 0; document.getElementById('mUnit').value = 'each';
      document.getElementById('mPhotoLabel').style.display = ''; const pb = document.getElementById('mPhotoBtn'); pb.style.display = ''; pb.textContent = 'Take a photo'; pb.classList.remove('has');
      document.getElementById('mRetire').style.display = 'none';
      document.getElementById('mGo').textContent = 'Add to list'; document.getElementById('mGo').disabled = false;
      document.getElementById('modal').classList.add('show');
      setTimeout(() => document.getElementById('mName').focus(), 80);
    }
    function openEdit(t){
      editing = t; fillCats();
      document.getElementById('mTitle').textContent = 'Edit ' + t.item_code;
      document.getElementById('mName').value = t.item_name; document.getElementById('mSize').value = t.size || ''; document.getElementById('mLoc').value = t.location || '';
      document.getElementById('mCat').value = t.category; document.getElementById('mQty').value = t.quantity; document.getElementById('mUnit').value = t.unit; document.getElementById('mNotes').value = t.notes || '';
      document.getElementById('mPhotoLabel').style.display = 'none'; document.getElementById('mPhotoBtn').style.display = 'none';
      document.getElementById('mRetire').style.display = 'inline';
      document.getElementById('mGo').textContent = 'Save changes'; document.getElementById('mGo').disabled = false;
      document.getElementById('modal').classList.add('show');
    }
    function closeModal(){ document.getElementById('modal').classList.remove('show'); editing = null; modalPhotoB64 = null; }
    document.getElementById('addBtn').addEventListener('click', openAdd);
    document.getElementById('mCancel').addEventListener('click', closeModal);
    document.getElementById('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
    document.getElementById('mPhotoBtn').addEventListener('click', () => { pendingPhoto = { forModal: true }; const p = document.getElementById('picker'); p.value = ''; p.click(); });
    async function adminCall(body){
      const res = await fetch(ADMIN_URL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(Object.assign({ token: ADMIN_KEY }, body)) });
      const data = await res.json().catch(() => null);
      if (!data || data.ok !== true) throw new Error((data && data.message) || 'Could not save');
      return data;
    }
    function applyRow(t, d){ Object.assign(t, { item_name: d.item_name, category: d.category, size: d.size, location: d.location, quantity: d.quantity, unit: d.unit, notes: d.notes, count_verified: d.count_verified }); }
    document.getElementById('mGo').addEventListener('click', async () => {
      const name = document.getElementById('mName').value.trim();
      if (!name) { toast('Give it a name', 'bad'); return; }
      const fields = { name, category: document.getElementById('mCat').value, size: document.getElementById('mSize').value.trim(), location: document.getElementById('mLoc').value.trim(), quantity: document.getElementById('mQty').value, unit: document.getElementById('mUnit').value, notes: document.getElementById('mNotes').value.trim() };
      const btn = document.getElementById('mGo'); btn.disabled = true; btn.textContent = 'Saving…';
      try {
        if (editing) {
          const d = await adminCall(Object.assign({ action: 'surplus_update', itemCode: editing.item_code }, fields));
          applyRow(editing, d); toast(d.item_code + ' updated', 'ok');
        } else {
          const d = await adminCall(Object.assign({ action: 'surplus_add' }, fields));
          const t = { item_code: d.item_code, photo_path: null }; applyRow(t, d); items.push(t);
          if (modalPhotoB64) { btn.textContent = 'Uploading photo…'; try { await uploadPhoto(t.item_code, modalPhotoB64); t.photo_path = t.item_code.toLowerCase() + '.jpg'; } catch(e) { toast('Added as ' + t.item_code + ', but the photo failed. Tap the card to retry.', 'bad'); closeModal(); render(); return; } }
          toast('Added ' + d.item_name + ' as ' + d.item_code, 'ok');
        }
        closeModal(); render();
      } catch(err) { toast(err.message || 'Could not save', 'bad'); btn.disabled = false; btn.textContent = editing ? 'Save changes' : 'Add to list'; }
    });
    document.getElementById('mRetire').addEventListener('click', async () => {
      if (!editing) return;
      if (!confirm('Remove ' + editing.item_name + ' from the list? It stays in the history.')) return;
      try { await adminCall({ action: 'surplus_update', itemCode: editing.item_code, active: false }); items = items.filter(x => x !== editing); cart.delete(editing.item_code); toast('Removed', 'ok'); closeModal(); render(); }
      catch(err) { toast(err.message, 'bad'); }
    });
    load();
    HagDevice.init({ selectId: 'takeName', verb: 'Taking' });
  </script>
</body>
