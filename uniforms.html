<style>
  :root{
    --bg:#232323; --card:#2b2b2b; --line:#3a3a3a; --field:#2b2b2b;
    --orange:#F68922; --orange-press:#d9760f;
    --ink:#1b1b1b; --paper:#f4f4f2; --muted:#9a9a9a; --gray:#4D4D4D;
    --green:#3fb27f; --green-press:#349d6e;
    --danger:#c0392b; --amber:#e0a526;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;min-height:100%;}
  body{background:var(--bg); color:var(--paper);
    font-family:"Calibri","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    min-height:100dvh; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  .wrap{max-width:460px; width:100%; margin:0 auto; padding:20px 22px 28px; display:flex; flex-direction:column; min-height:100dvh;}
  .top{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .back{appearance:none; background:none; border:0; padding:8px; margin:-8px 0 -8px -8px; color:var(--paper); text-decoration:none; display:flex;}
  .mark{height:34px; width:auto;}
  .mark-rhino{margin-left:-4px;}
  .htitle{font-family:"Arial Narrow",Arial,sans-serif; font-weight:800; letter-spacing:.14em; text-transform:uppercase; font-size:17px;}
  .rule{height:6px; margin:0 0 22px; border-radius:4px; background:repeating-linear-gradient(135deg,var(--orange) 0 14px,#2b2b2b 14px 26px);}

  .brandToggle{display:flex; background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:4px; margin-bottom:22px;}
  .brandToggle button{flex:1; appearance:none; border:0; background:transparent; color:var(--muted); padding:10px; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; border-radius:9px; display:flex; align-items:center; justify-content:center; gap:8px;}
  .brandToggle button img{height:22px; width:auto; opacity:.55;}
  .brandToggle button.active{background:var(--orange); color:var(--ink);}
  .brandToggle button.active img{opacity:1;}
  .field{margin-bottom:20px;}
  label,.lbl{display:block; font-size:13px; font-weight:600; letter-spacing:.02em; color:var(--muted); text-transform:uppercase; margin-bottom:8px;}
  select,input{width:100%; appearance:none; background:var(--field); color:var(--paper);
    border:1.5px solid var(--line); border-radius:12px; padding:16px 15px; font-size:17px; font-family:inherit;}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' stroke='%239a9a9a' stroke-width='2'><path d='M5 8l5 5 5-5'/></svg>");
    background-repeat:no-repeat; background-position:right 14px center; padding-right:42px;}
  select:focus,input:focus{outline:none; border-color:var(--orange);}
  .req{color:var(--orange); font-weight:700; margin-left:2px;}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .tile{appearance:none; text-align:left; background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:0; color:var(--paper);
    font-family:inherit; cursor:pointer; overflow:hidden; display:flex; flex-direction:column;}
  .tile:active{border-color:var(--orange);}
  .tile .ph{aspect-ratio:4/3; background:#1e1e1e; display:flex; align-items:center; justify-content:center; color:var(--gray);}
  .tile .ph img{width:100%; height:100%; object-fit:cover;}
  .tile .tx{padding:10px 12px 12px;}
  .tile .nm{font-size:15px; font-weight:700; line-height:1.2;}
  .tile .mt{font-size:12px; color:var(--muted); margin-top:4px;}
  .tile .mt.out{color:#e07a6e;}
  .tile.none{opacity:.5;}
  .cat{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-weight:700; margin:18px 0 8px;}
  .cat:first-child{margin-top:0;}

  .cart{margin-top:6px;}
  .line{display:flex; align-items:center; gap:10px; background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px;}
  .line .info{flex:1; min-width:0;}
  .line .name{font-size:15px; font-weight:600;}
  .line .meta{font-size:12px; color:var(--muted); margin-top:2px;}
  .line .x{appearance:none; background:transparent; border:0; color:var(--muted); cursor:pointer; padding:4px 6px; font-size:22px; line-height:1;}
  .empty{color:var(--muted); font-style:italic; text-align:center; padding:14px 0; font-size:14px;}

  .submit{appearance:none; border:0; border-radius:16px; padding:22px; font-size:19px; font-weight:700; font-family:inherit;
    background:var(--orange); color:var(--ink); cursor:pointer; width:100%; margin-top:18px; transition:transform .06s, background .15s;}
  .submit:active{transform:scale(.985); background:var(--orange-press);}
  .submit:disabled{opacity:.5; cursor:default;}
  .sticky{position:sticky; bottom:0; padding:10px 0 4px; background:linear-gradient(to top,var(--bg) 70%,transparent);}

  /* size sheet */
  .ov{position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:50; display:none; align-items:flex-end; justify-content:center;}
  .ov.show{display:flex;}
  .sheet{background:var(--bg); width:100%; max-width:460px; border-radius:20px 20px 0 0; padding:20px 20px calc(24px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;}
  .sheetTop{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:6px;}
  .sheetTitle{font-family:Georgia,serif; font-size:21px;}
  .sheetSub{color:var(--muted); font-size:14px; margin-bottom:16px;}
  .close{appearance:none; background:transparent; border:0; color:var(--muted); cursor:pointer; padding:4px;}
  .sizes{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px;}
  .sz{appearance:none; background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:12px 6px; color:var(--paper); font-family:inherit; cursor:pointer; text-align:center;}
  .sz b{display:block; font-size:18px;}
  .sz span{display:block; font-size:12px; color:var(--muted); margin-top:3px;}
  .sz.on{border-color:var(--orange); background:rgba(246,137,34,.14);}
  .sz:disabled{opacity:.38; cursor:default;}
  .sz.low span{color:var(--amber);}
  .step{display:flex; align-items:center; gap:14px; margin-bottom:6px;}
  .step button{appearance:none; width:52px; height:52px; border-radius:12px; border:1.5px solid var(--line); background:var(--card); color:var(--paper); font-size:24px; font-family:inherit; cursor:pointer;}
  .step output{font-size:24px; font-weight:700; min-width:40px; text-align:center;}

  .errBox{background:rgba(200,60,60,.14); border:1px solid rgba(200,60,60,.5); border-radius:12px; padding:14px 16px; margin-bottom:16px; font-size:14px; display:none;}
  .errBox.show{display:block;}

  .done{display:none; flex-direction:column; align-items:center; text-align:center; flex:1; justify-content:center; padding:20px 0;}
  .done.show{display:flex;}
  .check{width:84px; height:84px; border-radius:50%; background:rgba(63,178,127,.14); display:flex; align-items:center; justify-content:center; margin-bottom:22px;}
  .done h2{font-family:Georgia,serif; font-size:26px; margin:0 0 12px;}
  .done ul{list-style:none; padding:0; margin:0; font-size:17px; line-height:1.6;}
  .done .acts{display:flex; flex-direction:column; gap:12px; width:100%; margin-top:30px;}
  .ghost,.solid{appearance:none; border-radius:14px; padding:18px; font-size:17px; font-weight:700; font-family:inherit; cursor:pointer; text-decoration:none; text-align:center;}
  .ghost{border:2px solid var(--gray); background:transparent; color:var(--paper);}
  .solid{border:0; background:var(--orange); color:var(--ink);}
  .loading{color:var(--muted); text-align:center; padding:30px 0;}
</style>
</head>

  <div id="mainForm">
    <div class="brandToggle" id="brandToggle" role="tablist" aria-label="Which uniforms">
      <button type="button" data-brand="Haggerty" role="tab"><img alt="" data-logo="h">Haggerty</button>

      <label for="name">Your name <span class="req">*</span></label>

      <span class="lbl">Tap an item to pick a size</span>

      <button class="submit" id="submitBtn" type="button" disabled>Take items</button>
    </div>
  </div>

    <div class="check"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#3fb27f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>

      <button class="solid" type="button" id="againBtn">Take something else</button>
      <a class="ghost" href="index.html">Back to Shop Tools</a>
    </div>

</main>

<div class="ov" id="ov">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheetTop">
      <div class="sheetTitle" id="sheetTitle"></div>
      <button class="close" type="button" id="closeBtn" aria-label="Close">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheetSub" id="sheetSub"></div>
    <span class="lbl">Size</span>
    <div class="sizes" id="sizes"></div>
    <span class="lbl">How many</span>
    <div class="step">
      <button type="button" id="minus" aria-label="Fewer">−</button>
      <output id="qty">1</output>
      <button type="button" id="plus" aria-label="More">+</button>
    </div>
    <button class="submit" type="button" id="addBtn" disabled>Pick a size</button>
  </div>
</div>

<script src="device.js"></script>
<script>
(function(){
  const SUPABASE_URL = "https://tdflgfuqjnwctadsjizz.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_w9xkQQE07152NL8faFVTwQ_LSJ9Hf_d";
  const H = { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' };
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const SHIRT = '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8 3l-5 3 2 4 2-1v12h10V9l2 1 2-4-5-3c0 2-1.8 3-4 3S8 5 8 3z"/></svg>';

  let catalog = [], catalogLoaded = false;
  let cart = [];            // {item_code, item_name, brand, size, quantity}
  let pick = null;          // {item, size, qty}
  const BRAND_KEY = 'haggerty_uniform_brand';
  const urlBrand = (new URLSearchParams(location.search).get('brand') || '').toLowerCase();
  let brand = urlBrand === 'rhino' ? 'RHINO' : urlBrand === 'haggerty' ? 'Haggerty' : '';
  if (!brand){ try{ brand = localStorage.getItem(BRAND_KEY) || ''; }catch(e){} }
  if (brand !== 'RHINO') brand = 'Haggerty';
  function setBrand(b){
    brand = b; try{ localStorage.setItem(BRAND_KEY, b); }catch(e){}
    document.querySelectorAll('#brandToggle button').forEach(x => { const on = x.dataset.brand === b; x.classList.toggle('active', on); x.setAttribute('aria-selected', on); });
    renderCatalog();
  }
  document.querySelector('[data-logo="h"]').src = document.querySelector('.mark').src;
  document.querySelector('[data-logo="r"]').src = document.querySelector('.mark-rhino').src;
  document.querySelectorAll('#brandToggle button').forEach(x => x.addEventListener('click', () => setBrand(x.dataset.brand)));

  async function rpc(fn, body){
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, { method:'POST', headers:H, body: JSON.stringify(body || {}) });
    const data = await res.json().catch(() => null);
    if (!res.ok) throw new Error((data && (data.message || data.hint)) || ('Request failed (' + res.status + ')'));
    return data;
  }
  function showErr(msg){ const b = $('errBox'); b.textContent = msg; b.classList.toggle('show', !!msg); if (msg) b.scrollIntoView({behavior:'smooth', block:'center'}); }

  async function loadPeople(){
    try{
      const res = await fetch(SUPABASE_URL + '/rest/v1/people?select=name&active=eq.true&order=name', { headers:H });
      const rows = await res.json();
      const sel = $('name');
      sel.innerHTML = '<option value="" selected disabled>Choose your name</option>' + rows.map(r => '<option>' + esc(r.name) + '</option>').join('');
    }catch(e){ showErr('Could not load names. Check your signal and reload.'); }
  }

  async function loadCatalog(){
    try{
      catalog = await rpc('uniform_catalog');
      catalogLoaded = true;
      renderCatalog();
    }catch(e){ $('catalog').innerHTML = '<div class="empty">Could not load uniforms. Check your signal and reload.</div>'; }
  }

  function inCart(code, size){ return cart.filter(c => c.item_code === code && c.size === size).reduce((a,c) => a + c.quantity, 0); }
  function available(item, size){ const s = item.sizes.find(x => x.size === size); return s ? s.quantity - inCart(item.item_code, size) : 0; }

  function renderCatalog(){
    if (!catalogLoaded) return;
    const list = catalog.filter(i => (i.brand || 'Haggerty') === brand);
    if (!list.length){ $('catalog').innerHTML = '<div class="empty">No ' + esc(brand) + ' uniforms set up yet.</div>'; return; }
    const groups = {};
    list.forEach(i => (groups[i.category] = groups[i.category] || []).push(i));
    let html = '';
    Object.keys(groups).forEach(cat => {
      html += '<div class="cat">' + esc(cat) + '</div><div class="grid">';
      groups[cat].forEach(i => {
        const left = i.sizes.reduce((a,s) => a + Math.max(0, available(i, s.size)), 0);
        const inStock = i.sizes.filter(s => available(i, s.size) > 0).map(s => s.size);
        const meta = left ? (inStock.length > 4 ? inStock.length + ' sizes in stock' : inStock.join(' · ')) : 'Out of stock';
        html += '<button type="button" class="tile' + (left ? '' : ' none') + '" data-code="' + esc(i.item_code) + '">'
          + '<div class="ph">' + (i.photo_url ? '<img src="' + esc(i.photo_url) + '" alt="" loading="lazy">' : SHIRT) + '</div>'
          + '<div class="tx"><div class="nm">' + esc(i.item_name) + '</div>'
          + '<div class="mt' + (left ? '' : ' out') + '">' + esc((i.color ? i.color + ' · ' : '') + meta) + '</div></div></button>';
      });
      html += '</div>';
    });
    $('catalog').innerHTML = html;
    $('catalog').querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => openSheet(t.dataset.code)));
  }

  function openSheet(code){
    const item = catalog.find(i => i.item_code === code); if (!item) return;
    pick = { item, size: null, qty: 1 };
    $('sheetTitle').textContent = item.item_name;
    $('sheetSub').textContent = [item.color, item.description && !/^Starter item/.test(item.description) ? item.description : ''].filter(Boolean).join(' · ');
    const one = item.sizes.filter(s => available(item, s.size) > 0);
    if (one.length === 1) pick.size = one[0].size;
    renderSheet();
    $('ov').classList.add('show');
  }
  function renderSheet(){
    const item = pick.item;
    $('sizes').innerHTML = item.sizes.map(s => {
      const a = available(item, s.size);
      const low = a > 0 && a <= s.reorder_threshold;
      return '<button type="button" class="sz' + (pick.size === s.size ? ' on' : '') + (low ? ' low' : '') + '" data-size="' + esc(s.size) + '"' + (a > 0 ? '' : ' disabled') + '>'
        + '<b>' + esc(s.size) + '</b><span>' + (a > 0 ? a + ' left' : 'Out') + '</span></button>';
    }).join('');
    $('sizes').querySelectorAll('.sz').forEach(b => b.addEventListener('click', () => { pick.size = b.dataset.size; pick.qty = 1; renderSheet(); }));
    const max = pick.size ? available(item, pick.size) : 0;
    if (pick.qty > max) pick.qty = Math.max(1, max);
    $('qty').textContent = pick.qty;
    $('minus').disabled = pick.qty <= 1;
    $('plus').disabled = !pick.size || pick.qty >= max;
    $('addBtn').disabled = !pick.size;
    $('addBtn').textContent = pick.size ? 'Add ' + pick.qty + ' × ' + pick.size : 'Pick a size';
  }
  function closeSheet(){ $('ov').classList.remove('show'); pick = null; }

  function addPick(){
    if (!pick || !pick.size) return;
    const ex = cart.find(c => c.item_code === pick.item.item_code && c.size === pick.size);
    if (ex) ex.quantity += pick.qty;
    else cart.push({ item_code: pick.item.item_code, item_name: pick.item.item_name, brand: pick.item.brand || 'Haggerty', size: pick.size, quantity: pick.qty });
    closeSheet(); renderCart(); renderCatalog();
  }

  function renderCart(){
    $('cart').innerHTML = cart.length ? cart.map((c, i) =>
      '<div class="line"><div class="info"><div class="name">' + esc(c.item_name) + '</div><div class="meta">' + esc(c.brand) + ' · Size ' + esc(c.size) + ' · Qty ' + c.quantity + '</div></div>'
      + '<button type="button" class="x" data-i="' + i + '" aria-label="Remove">×</button></div>').join('')
      : '<div class="empty">Nothing picked yet</div>';
    $('cart').querySelectorAll('.x').forEach(b => b.addEventListener('click', () => { cart.splice(+b.dataset.i, 1); renderCart(); renderCatalog(); }));
    const n = cart.reduce((a,c) => a + c.quantity, 0);
    $('submitBtn').disabled = !n;
    $('submitBtn').textContent = n ? 'Take ' + n + ' item' + (n > 1 ? 's' : '') : 'Take items';
  }

  async function submit(){
    showErr('');
    const name = $('name').value;
    if (!name){ showErr('Pick your name first.'); $('name').focus(); return; }
    if (!cart.length) return;
    const gate = await HagDevice.ensure(name);
    if (!gate.ok) return;
    const btn = $('submitBtn'); btn.disabled = true; btn.textContent = 'Saving…';
    try{
      const r = await rpc('uniform_take_d', { p_device_token: HagDevice.token(), p_person: name,
        p_items: cart.map(c => ({ item_code: c.item_code, size: c.size, quantity: c.quantity })), p_notes: null });
      if (!r || !r.ok){ showErr((r && r.message) || 'Could not save. Try again.'); await loadCatalog(); renderCart(); return; }
      HagDevice.claim(name);
      $('doneWho').textContent = r.person;
      $('doneList').innerHTML = r.items.map(i => '<li>' + i.quantity + ' × ' + esc(i.item_name) + ' (' + esc(i.size) + ')</li>').join('');
      $('mainForm').style.display = 'none';
      $('done').classList.add('show');
      cart = []; renderCart(); loadCatalog();
    }catch(e){ showErr(e.message || 'Could not save. Check your signal and try again.'); renderCart(); }
  }

  $('closeBtn').addEventListener('click', closeSheet);
  $('ov').addEventListener('click', e => { if (e.target === $('ov')) closeSheet(); });
  $('minus').addEventListener('click', () => { if (pick && pick.qty > 1){ pick.qty--; renderSheet(); } });
  $('plus').addEventListener('click', () => { if (pick && pick.size && pick.qty < available(pick.item, pick.size)){ pick.qty++; renderSheet(); } });
  $('addBtn').addEventListener('click', addPick);
  $('submitBtn').addEventListener('click', submit);
  $('againBtn').addEventListener('click', () => { $('done').classList.remove('show'); $('mainForm').style.display = ''; window.scrollTo(0,0); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

  setBrand(brand);
  loadPeople().then(() => HagDevice.init({ selectId: 'name', verb: 'Taking uniforms' }));
  loadCatalog();
})();
</script>
</body>
</html>
